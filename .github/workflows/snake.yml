name: Images du profil

# Régénère chaque jour les images affichées dans le README du profil
# (cartes de statistiques et animation du calendrier de contributions)
# et les publie sur la branche « output ».
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml", "scripts/**"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cartes de statistiques
        run: node scripts/generate-cards.mjs ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#047857&color_dots=#ebedf0,#a7f3d0,#34d399,#10b981,#047857
            dist/github-snake-dark.svg?color_snake=#f6eedd&color_dots=#161b22,#065f46,#059669,#10b981,#6ee7b7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
